services:
  app:
    image: oven/bun:1-alpine
    container_name: bun-app
    working_dir: /home/bun/app

    volumes:
      - ./app:/home/bun/app

    command: bun run start

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    restart: unless-stopped

    networks:
      - app_network

  web:
    image: nginx:1.27-alpine
    container_name: nginx-proxy

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      app:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - app_network

  db:
    image: postgres:15-alpine
    container_name: postgres-db

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped

    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: redis-cache

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    restart: unless-stopped

    networks:
      - app_network

  dozzle:
    image: amir20/dozzle:v8
    container_name: dozzle

    ports:
      - "8080:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    restart: unless-stopped

    networks:
      - app_network

  portainer:
    image: portainer/portainer-ce:2.27.1
    container_name: portainer

    ports:
      - "9443:9443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

    restart: unless-stopped

    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:
  portainer_data:

networks:
  app_network:
    driver: bridge
